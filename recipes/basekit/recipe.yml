name: BaseKit
description: Baseline modules and shared configuration for the BaseKit distribution.
type: recipe
install:
  # Core/contrib modules required by shared config and common features.
  - drupal:layout_builder
  - drupal:media
  - drupal:media_library
  - drupal:responsive_image
  - drupal:image
  - drupal:image_effects
  - drupal:focal_point
  - drupal:views
  - drupal:editor
  - drupal:ckeditor5
  - drupal:webform
  # These two names must remain unqualified because config-action validation
  # compares providers with the literal install list before dependencies are
  # normalized.
  - antibot
  - honeypot
  - drupal:workflows
  # Admin UX
  - drupal:gin
  - drupal:gin_toolbar
  - drupal:toolbar
  - drupal:admin_toolbar
  - drupal:admin_toolbar_tools
  # Base content building blocks and storage.
  - drupal:block
  - drupal:block_content
  - drupal:field
  - drupal:text
  - drupal:node
  - drupal:taxonomy
  # Media, SVG, and image tooling
  - drupal:svg_image
  - drupal:inline_svg
  - drupal:crop
  # Layout builder enhancements and site UX
  - drupal:layout_builder_modal
  - drupal:layout_builder_styles
  - drupal:easy_breadcrumb
  - drupal:bg_image_formatter
  - drupal:environment_indicator
  # Content formatting and developer tools
  - drupal:prism
  - drupal:profile
  - drupal:token
  # Navigation and content patterns
  - drupal:paragraphs
  - drupal:superfish
  - drupal:menu_block
  - drupal:eva
  - drupal:swiper_formatter
  - drupal:twig_tweak
  # Config management tooling
  - drupal:config_split
config:
  strict: false
  actions:
    node.settings:
      simpleConfigUpdate:
        use_admin_theme: true
    gin.settings:
      simpleConfigUpdate:
        classic_toolbar: horizontal
    antibot.settings:
      simpleConfigUpdate:
        form_ids:
          - 'webform_submission_*'
          - 'contact_message_*'
          - 'contact_*'
        excluded_form_ids: {}
        show_form_ids: false
    honeypot.settings:
      simpleConfigUpdate:
        protect_all_forms: true
        unprotected_forms:
          - user_login_form
          - search_form
          - search_block_form
          - views_exposed_form
          - honeypot_settings_form
        log: true
        element_name: website
        time_limit: 5
        expire: 300
    # Example theme mapping for region blocks (add entries if you include them):
    # - config: block.block.gravelle1_site_branding
    #   op: set
    #   path: theme
    #   value: gravelle1

    filter.format.full_html:
      setProperties:
        name: 'Content (advanced)'
        weight: 10
        filters:
          editor_file_reference:
            id: editor_file_reference
            provider: editor
            status: true
            weight: 11
            settings: {}
          filter_align:
            id: filter_align
            provider: filter
            status: true
            weight: 8
            settings: {}
          filter_caption:
            id: filter_caption
            provider: filter
            status: true
            weight: 9
            settings: {}
          filter_htmlcorrector:
            id: filter_htmlcorrector
            provider: filter
            status: true
            weight: 10
            settings: {}
          filter_image_lazy_load:
            id: filter_image_lazy_load
            provider: filter
            status: true
            weight: 15
            settings: {}
          media_embed:
            id: media_embed
            provider: media
            status: true
            weight: 100
            settings:
              default_view_mode: main_25
              allowed_view_modes:
                default: default
                main_100: main_100
                main_100_16x9: main_100_16x9
                main_100_21x9: main_100_21x9
                main_100_4x3: main_100_4x3
                main_25: main_25
                main_25_1x1: main_25_1x1
                main_33: main_33
                main_33_1x1: main_33_1x1
                main_33_4x3: main_33_4x3
                main_50: main_50
                main_50_16x9: main_50_16x9
                main_50_1x1: main_50_1x1
                main_50_4x3: main_50_4x3
                main_66: main_66
                main_66_16x9: main_66_16x9
                main_66_4x3: main_66_4x3
              allowed_media_types:
                image: image
    editor.editor.full_html:
      setProperties:
        settings:
          toolbar:
            items:
              - undo
              - redo
              - heading
              - drupalMedia
              - insertTable
              - bold
              - italic
              - strikethrough
              - superscript
              - subscript
              - removeFormat
              - bulletedList
              - numberedList
              - '|'
              - blockQuote
              - alignment
              - indent
              - outdent
              - link
              - specialCharacters
              - '|'
              - code
              - codeBlock
              - horizontalLine
              - '|'
              - style
              - showBlocks
              - sourceEditing
              - '-'
          plugins:
            ckeditor5_alignment:
              enabled_alignments:
                - center
                - justify
                - left
                - right
            ckeditor5_codeBlock:
              languages:
                - label: 'Plain text'
                  language: plaintext
                - label: C
                  language: c
                - label: 'C#'
                  language: cs
                - label: C++
                  language: cpp
                - label: CSS
                  language: css
                - label: Diff
                  language: diff
                - label: HTML
                  language: html
                - label: Java
                  language: java
                - label: JavaScript
                  language: javascript
                - label: PHP
                  language: php
                - label: Python
                  language: python
                - label: Ruby
                  language: ruby
                - label: TypeScript
                  language: typescript
                - label: XML
                  language: xml
            ckeditor5_heading:
              enabled_headings:
                - heading2
                - heading3
                - heading4
                - heading5
                - heading6
            ckeditor5_imageResize:
              allow_resize: true
            ckeditor5_list:
              properties:
                reversed: true
                startIndex: true
                styles: true
              multiBlock: true
            ckeditor5_sourceEditing:
              allowed_tags: {}
            ckeditor5_style:
              styles:
                - label: 'Font: body'
                  element: '<span class="font-body">'
                - label: 'Font: heading'
                  element: '<span class="font-heading">'
                - label: 'Font: condensed heading'
                  element: '<span class="font-heading-narrow">'
                - label: 'Paragraph: Smallest'
                  element: '<p class="copy-smallest">'
                - label: 'Paragraph: Smaller'
                  element: '<p class="copy-small">'
                - label: 'Paragraph: Normal'
                  element: '<p class="copy-normal">'
                - label: 'Paragraph: Larger'
                  element: '<p class="copy-large">'
                - label: 'Paragraph: Largest'
                  element: '<p class="copy-largest">'
                - label: 'Text: Smallest'
                  element: '<span class="copy-smallest">'
                - label: 'Text: Smaller'
                  element: '<span class="copy-small">'
                - label: 'Text: Normal'
                  element: '<span class="copy-normal">'
                - label: 'Text: Larger'
                  element: '<span class="copy-large">'
                - label: 'Text: Largest'
                  element: '<span class="copy-largest">'
                - label: 'Color: primary'
                  element: '<span class="text-primary">'
                - label: 'Color: accent'
                  element: '<span class="text-accent">'
                - label: 'Color: secondary'
                  element: '<span class="text-secondary">'
                - label: 'Color: neutral'
                  element: '<span class="text-neutral">'
                - label: 'Color: light'
                  element: '<span class="text-light">'
                - label: 'Underline: accent'
                  element: '<span class="underline-accent">'
                - label: 'Background: light'
                  element: '<span class="surface-light">'
                - label: 'Background: primary'
                  element: '<span class="surface-primary">'
                - label: 'Background: accent'
                  element: '<span class="surface-accent">'
            media_media:
              allow_view_mode_override: true
        image_upload:
          status: true
          scheme: public
          directory: inline-images
          max_size: null
          max_dimensions:
            width: null
            height: null
    user.role.content_editor:
      grantPermissions:
        - use text format content
        - use text format text_only
